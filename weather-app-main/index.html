<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/css/styles.css" />
    <link rel="stylesheet" href="src/css/bootstrap.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <title>WeatherApp</title>
  </head>
  <body>
    <header class="container py-5">
      <div class="d-flex align-items-center justify-content-between">
        <img class="img-fluid" src="assets/images/logo.svg" alt="logo" />

        <div class="dropdown">
          <button
            class="btn btn-outline-light dropdown-toggle"
            type="button"
            id="unitsDropdown"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <img class="img-fluid w-25" src="assets/images/icon-units.svg" />
            Units
          </button>
          <ul class="dropdown-menu" aria-labelledby="unitsDropdown">
            <li><h6 class="dropdown-header">Switch to Imperial</h6></li>
            <li class="dropdown-header">Temperature</li>
            <li><a class="dropdown-item active" href="#">Celsius (°C)</a></li>
            <li><a class="dropdown-item" href="#">Fahrenheit (°F)</a></li>
            <li class="dropdown-header">Wind Speed</li>
            <li><a class="dropdown-item active" href="#">km/h</a></li>
            <li><a class="dropdown-item" href="#">mph</a></li>
            <li class="dropdown-header">Precipitation</li>
            <li>
              <a class="dropdown-item active" href="#">Millimeters (mm)</a>
            </li>
            <li><a class="dropdown-item" href="#">Inches (in)</a></li>
          </ul>
        </div>
      </div>
    </header>

    <section class="container">
      <h1 class="text-center text-white py-5">How's the sky looking today?</h1>

      <div class="d-flex gap-2 w-50 m-auto">
        <input
          type="text"
          id="place"
          class="form-control bg-body py-3"
          placeholder="Search for a place..."
        />
        <button class="btn btn-primary px-4" id="boton">Search</button>
      </div>

      <div class="row py-5 " id="resultados"></div>
    </section>
  </body>
  <script src="src/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="src/js/app.js"></script>
</html>
